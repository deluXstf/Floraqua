name: plant_garden
description: "Floraqua — приложение для управления домашними растениями"
publish_to: 'none'
version: 1.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Сеть / Gemini API
  http: ^1.2.0
  # Хранение данных
  path_provider: ^2.1.2
  flutter_secure_storage: ^9.0.0
  # Изображения
  image_picker: ^1.0.7
  image: ^4.1.7
  file_picker: ^8.0.0
  # Уведомления
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^1.0.8
  # Системный трей (только desktop — Windows/macOS/Linux)
  tray_manager: ^0.2.3
  window_manager: ^0.3.9
  # Экспорт/импорт
  archive: ^3.4.10
  share_plus: ^7.2.2
  # Утилиты
  intl: ^0.19.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
